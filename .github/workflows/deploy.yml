name: Deploy Landing Page Debby

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy via webhook
        run: |
          curl --proto '=https' -fsS -X POST \
            https://estudiodadebbypiercing.com.br/hooks/deploy-debby-hub \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 2 --retry-delay 10 --retry-connrefused
          echo "Webhook disparado com sucesso"
